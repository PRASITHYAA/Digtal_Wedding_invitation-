<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Our Timeline — Santhosh &amp; Prasithya</title>
  <meta name="theme-color" content="#3A0F1B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root{--noir:#0B0B0D;--emerald-deep:#081C16;--gold:#C6A15B;--gold-light:#E7CE94;--gold-dim:#8A6E3B;--ivory:#F8F4EA;--ivory-warm:#F1E9D8;--wine:#3A0F1B;--ink:#1C1712;--serif:'EB Garamond',serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--serif);background:var(--ivory);color:var(--ink);overflow-x:hidden}
    .hero{background:var(--wine);color:var(--ivory);text-align:center;padding:70px 20px 46px}
    .eyebrow{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
    h1{font-size:clamp(30px,6vw,48px);color:var(--gold-light);margin-top:12px;font-weight:500}
    .sub{font-style:italic;margin-top:8px;opacity:.9}
    .wrap{max-width:680px;margin:0 auto;padding:50px 20px 30px}
    .tl{list-style:none;position:relative;padding-left:34px}
    .tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:linear-gradient(var(--gold),var(--gold-dim))}
    .tl-item{position:relative;background:var(--ivory-warm);border:1px solid rgba(198,161,91,.5);border-radius:14px;padding:16px 18px;margin-bottom:18px}
    .tl-dot{position:absolute;left:-31px;top:22px;width:11px;height:11px;background:var(--gold);transform:rotate(45deg)}
    .tl-date{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold-dim);font-weight:500}
    .tl-item p{font-style:italic;font-size:clamp(17px,2.4vw,20px);line-height:1.6;color:var(--wine);margin-top:6px}
    .note{text-align:center;font-size:13px;color:var(--gold-dim);margin-top:6px;min-height:18px}
    .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:10px 20px 50px}
    .btn{padding:12px 24px;border:1px solid var(--gold);color:var(--wine);text-decoration:none;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;transition:.25s}
    .btn:hover{background:var(--gold);color:var(--noir)}
    .btn.filled{background:var(--wine);border-color:var(--wine);color:var(--gold-light)}
    footer{background:var(--emerald-deep);color:var(--gold-light);text-align:center;padding:34px 20px;font-style:italic}
    footer b{display:block;font-style:normal;font-weight:500;font-size:24px;margin-top:8px}
  </style>
  <script src="config.js"></script>
</head>
<body>
  <section class="hero">
    <div class="eyebrow">Moment by Moment</div>
    <h1>Our Timeline</h1>
    <p class="sub">Santhosh &amp; Prasithya</p>
  </section>
  <div class="wrap">
    <div id="tl"><p class="note">Loading…</p></div>
    <div class="note" id="note"></div>
  </div>
  <footer>With love,<b>Santhosh &amp; Prasithya</b></footer>
  <div id="siteNav"></div>
  <script>
/* Shared by timeline.html and timeline-admin.html */
const TL = {
  API: '/api/timeline',
  LOCAL: 'timelineLocal',
  SEED: [
    ['old3', '', 'Gym meeting'],
    ['old4', '', 'Our first bike ride'],
    ['old5', '', 'Our first movie date'],
    ['seed0', '', 'The first time I came to Santhosh’s house ❤️'],
    ['old1', '2025-11-11', 'Our first phone call'],
    ['old2', '2025-11-17', 'Our first meeting at the temple'],
    ['old6', '2026-03-14', 'Ooty trip'],
    ['old7', '2026-07-03', 'Chennai trip'],
    ['old8', '2026-08-10', 'Our first kiss on the long bike ride'],
    ['old9', '2026-08-14', 'Car kiss'],
    ['seed1', '2026-08-30', 'The first time Prasithya bought a wish for me ❤️'],
    ['seed2', '2026-09-12', 'Our first honeymoon in Vallapi ❤️'],
    ['seed3', '2026-09-28', 'Our first night of separation after marriage — I was in Tiruppur, missing you'],
    ['seed4', '2026-10-16', 'Took Ammachi to the hospital, spent the night apart, and sent each other “Miss you” messages ❤️'],
    ['seed5', '2026-10-26', 'The day Santhosh stood up for me during a fight with my mother']
  ].map(([id, date, text]) => ({ id, date, text })),
  tfetch(u, o) { const c = new AbortController(), t = setTimeout(() => c.abort(), 8000); return fetch(u, Object.assign({}, o, { signal: c.signal })).finally(() => clearTimeout(t)); },   /* never hang forever */
  esc: s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c])),
  fmt(d) {
    if (!d) return 'Where it all began';
    const [y, m, day] = d.split('-').map(Number);
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m - 1] + ' ' + day + ', ' + y;
  },
  local() { try { return JSON.parse(localStorage.getItem(TL.LOCAL) || '[]'); } catch { return []; } },
  saveLocal(item) { const a = TL.local(); a.push(item); try { localStorage.setItem(TL.LOCAL, JSON.stringify(a)); } catch {} },
  sort: a => a.slice().sort((x, y) => (x.date || '').localeCompare(y.date || '')),
  _base: null,
  async req(q, opts) {   /* find the API: saved address, same site, then http://localhost:3000 */
    let bases = TL._base !== null ? [TL._base] : [], last;
    if (!bases.length) {
      let s = ''; try { s = (localStorage.getItem('tlApiBase') || '').trim().replace(/\/+$/, ''); } catch {}
      const cfg = String((window.TL_CONFIG||{}).API_BASE||'').trim().replace(/[/]+$/, ''), dev = ['localhost','127.0.0.1',''].includes(location.hostname);
      bases = s ? [s] : cfg ? [cfg] : dev ? ['', 'http://localhost:3000'] : [];   /* never call localhost from a deployed site */
    }
    for (const b of bases) {
      try {
        const r = await TL.tfetch(b + TL.API + (q || ''), opts);
        if ((r.headers.get('content-type') || '').includes('json')) { TL._base = b; return r; }
      } catch (e) { last = e; }
    }
    throw last || new Error('API not found');
  },
  SB: { url: (window.TL_CONFIG||{}).SUPABASE_URL||'', key: (window.TL_CONFIG||{}).SUPABASE_KEY||'' },   /* ONLINE SITES: paste your Supabase Project URL and anon key here (see supabase-setup.sql) */
  sb() { return !!(TL.SB.url && TL.SB.key); },
  bad: r => r.status === 401 || r.status === 403 || /WRONG_KEY/.test(JSON.stringify(r.data || '')),
  err: r => (r.data && (r.data.error || r.data.message)) || 'Could not save.',
  /* One entry point for both back-ends (Supabase online / node server.js locally). kind: list | add | update | remove */
  async _do(kind, p, key) {
    p = p || {};
    if (TL.sb()) {
      const H = { apikey: TL.SB.key, Authorization: 'Bearer ' + TL.SB.key, 'Content-Type': 'application/json' };
      const U = TL.SB.url.replace(/\/+$/, '') + '/rest/v1/';
      const r = kind === 'list'
        ? await TL.tfetch(U + 'moments?select=id,date,text&order=date.asc,seq.asc', { headers: H })
        : await TL.tfetch(U + 'rpc/' + { add: 'add_moment', update: 'update_moment', remove: 'delete_moment' }[kind], { method: 'POST', headers: H, body: JSON.stringify({ k: key || '', i: p.id || '', d: p.date || '', t: p.text || '' }) });
      let data = null; try { data = await r.json(); } catch {}
      return { ok: r.ok, status: r.status, data };
    }
    const o = { method: { list: 'GET', add: 'POST', update: 'PUT', remove: 'DELETE' }[kind], headers: { 'Content-Type': 'application/json', 'x-admin-key': key || '' } };
    if (kind === 'add' || kind === 'update') o.body = JSON.stringify({ date: p.date || '', text: p.text || '' });
    const r = await TL.req(kind === 'list' || kind === 'add' ? '' : '?id=' + encodeURIComponent(p.id), o);
    let data = null; try { data = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data };
  },
  async mountStatus() {
    const el = document.getElementById('apiStatus'); if (!el) return;
    let ok = false; try { ok = (await TL._do('list')).ok; } catch {}
    let saved = ''; try { saved = localStorage.getItem('tlApiBase') || ''; } catch {}
    el.innerHTML = ok
      ? `<div class="api-bar ok"><b>● Server connected</b> <span>${TL.sb() ? 'Supabase' : TL.esc(TL._base || location.origin)}</span></div>`
      : TL.sb()
        ? `<div class="api-bar bad"><b>● Supabase not reachable</b> — entries are only saved on this device.<br>Check the Project URL and anon key in this page, and that <code>supabase-setup.sql</code> was run.</div>`
        : `<div class="api-bar bad"><b>● Server not reachable</b> — entries are only saved on this device.<br><b>Online site (Netlify / GitHub Pages / Vercel):</b> set up Supabase using <code>supabase-setup.sql</code>.<br><b>On your computer:</b> run <code>node server.js</code>, then open <code>http://localhost:3000/timeline-admin.html</code>.<div class="api-set"><input id="apiBase" placeholder="https://your-server.com" value="${TL.esc(saved)}"><button type="button" id="apiSave">Save &amp; retry</button></div></div>`;
    const b = el.querySelector('#apiSave');
    if (b) b.onclick = () => { try { localStorage.setItem('tlApiBase', el.querySelector('#apiBase').value.trim()); } catch {} location.reload(); };
  },
  async load() {   /* server items + anything saved only on this device, so nothing disappears */
    const local = TL.local();
    try {
      const r = await TL._do('list'); if (!r.ok) throw 0;
      const server = (TL.sb() ? r.data : r.data && r.data.items) || [];
      const extra = local.filter(l => !server.some(s => s.date === l.date && s.text === l.text));
      return { items: TL.sort(server.concat(extra)), online: true, localCount: extra.length };
    } catch { return { items: TL.sort(TL.SEED.concat(local)), online: false, localCount: local.length }; }
  },
  async add(date, text, key) {
    try {
      const r = await TL._do('add', { date, text }, key);
      if (TL.bad(r)) return { ok: false, msg: 'Wrong admin key.' };
      if (!r.ok) return { ok: false, msg: TL.err(r) };
      return { ok: true, msg: 'Added to the timeline ✓' };
    } catch {
      TL.saveLocal({ id: 'local' + Date.now(), date, text });
      return { ok: true, msg: 'Server not reachable — saved on this device only.' };
    }
  },
  setLocal(a) { try { localStorage.setItem(TL.LOCAL, JSON.stringify(a)); } catch {} },
  async update(id, date, text, key) {
    if (String(id).startsWith('local')) {
      const a = TL.local(), it = a.find(x => x.id === id); if (!it) return { ok: false, msg: 'Not found.' };
      it.date = date; it.text = text; TL.setLocal(a); return { ok: true, msg: 'Updated on this device ✓' };
    }
    try {
      const r = await TL._do('update', { id, date, text }, key);
      if (TL.bad(r)) return { ok: false, msg: 'Wrong admin key.' };
      if (!r.ok) return { ok: false, msg: TL.err(r) };
      return { ok: true, msg: 'Updated ✓' };
    } catch { return { ok: false, msg: 'Server not reachable — cannot edit right now.' }; }
  },
  async remove(id, key) {
    if (String(id).startsWith('local')) { TL.setLocal(TL.local().filter(x => x.id !== id)); return 'Deleted.'; }
    try {
      const r = await TL._do('remove', { id }, key);
      return r.ok ? 'Deleted.' : TL.bad(r) ? 'Wrong admin key.' : 'Could not delete.';
    } catch { return 'Server not reachable.'; }
  },
  async syncLocal(key) {   /* push device-only moments to the server */
    let rest = TL.local(), done = 0;
    for (const it of TL.local()) {
      let r; try { r = await TL._do('add', { date: it.date, text: it.text }, key); } catch { r = null; }
      if (!r || !r.ok) return { ok: false, msg: (!r ? 'Server not reachable.' : TL.bad(r) ? 'Wrong admin key.' : 'Could not sync.') + ' Synced ' + done + '.' };
      rest = rest.filter(x => x.id !== it.id); TL.setLocal(rest); done++;
    }
    return { ok: true, msg: done + ' moment(s) synced to the server ✓' };
  },
  syncBanner(box, keyEl, done) {
    if (!box) return; const n = TL.local().length;
    box.innerHTML = n ? `<div class="sync-bar">${n} moment${n > 1 ? 's are' : ' is'} saved only on this device (not on the server yet). <button type="button">Sync to server</button></div>` : '';
    if (n) box.querySelector('button').onclick = async () => { const r = await TL.syncLocal(keyEl.value); alert(r.msg); done(); };
  },
  side: d => d ? `<b>${+d.split('-')[2]}</b><small>${TL.MONTHS[+d.split('-')[1] - 1].slice(0, 3)}</small>` : '<b>—</b>',
  item: (i, hl) => `<li class="tl-row"><span class="tl-dot"></span><span class="tl-side">${TL.side(i.date)}</span><div class="tl-item${hl ? ' hl' : ''}"><div class="tl-date">${TL.esc(TL.fmt(i.date))}</div><p>${TL.esc(i.text)}</p></div></li>`,
  MONTHS: ['January','February','March','April','May','June','July','August','September','October','November','December'],
  NAV: [['Invitation', 'index.html'], ['Our Love Story', 'lovestory.html'], ['View Timeline', 'timeline.html'], ['Add Timeline', 'timeline-admin.html'], ['Admin', 'timeline-manage.html']],
  /* Undated moments on top, then Year (open/close) > Month (open/close) > moments. */
  group(items, openAll, hlId) {
    const li = i => TL.item(i, i.id === hlId);
    const undated = items.filter(i => !i.date), years = {};
    TL.sort(items.filter(i => i.date)).forEach(i => { const [y, m] = i.date.split('-'); ((years[y] = years[y] || {})[m] = years[y][m] || []).push(i); });
    const ys = Object.keys(years).sort(), lastY = ys[ys.length - 1];
    let h = undated.length ? '<ol class="tl tl-start">' + undated.map(li).join('') + '</ol>' : '';
    ys.forEach(y => {
      const ms = Object.keys(years[y]).sort(), lastM = ms[ms.length - 1];
      const count = ms.reduce((n, m) => n + years[y][m].length, 0);
      h += `<details class="tl-year"${openAll || y === lastY ? ' open' : ''}><summary><span>${y}</span><em>${count} moment${count > 1 ? 's' : ''}</em></summary>`;
      ms.forEach(m => {
        h += `<details class="tl-month"${openAll || (y === lastY && m === lastM) ? ' open' : ''}><summary><span>${TL.MONTHS[+m - 1]}</span><em>${years[y][m].length}</em></summary><ol class="tl">${years[y][m].map(li).join('')}</ol></details>`;
      });
      h += '</details>';
    });
    return h || '<ol class="tl"><li class="tl-item"><p>No moments yet.</p></li></ol>';
  },
  mountNav() {
    const el = document.getElementById('siteNav'); if (!el) return;
    const cur = location.pathname.split('/').pop() || 'index.html';
    el.innerHTML = '<nav class="site-nav" aria-label="Explore">' + TL.NAV.map(([t, h]) => `<a href="${h}"${h === cur ? ' aria-current="page"' : ''}>${t}</a>`).join('') + '</nav>';
  }
};
const TL_CSS = `.site-nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:26px 16px 34px;background:#081C16}.site-nav a{padding:10px 18px;border:1px solid #C6A15B;color:#E7CE94;text-decoration:none;font:500 12.5px 'EB Garamond',serif;letter-spacing:.16em;text-transform:uppercase;transition:.25s}.site-nav a:hover,.site-nav a[aria-current]{background:#C6A15B;color:#0B0B0D}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.tl-year{margin:0 0 16px;border:1px solid rgba(198,161,91,.55);border-radius:14px;background:#fffdf7;overflow:hidden}
.tl-year>summary{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#3A0F1B;color:#E7CE94;font-size:26px}
.tl-year>summary em,.tl-month>summary em{margin-left:auto;font-size:13px;letter-spacing:.15em;text-transform:uppercase;font-style:normal;opacity:.85}
.tl-month{margin:12px 12px 0;border:1px solid rgba(198,161,91,.45);border-radius:10px;background:#F1E9D8}
.tl-month:last-child{margin-bottom:12px}
.tl-month>summary{display:flex;align-items:center;gap:10px;padding:11px 14px;color:#3A0F1B;font-size:20px;font-weight:500}
.tl-month>summary em{color:#8A6E3B}
.tl-month>.tl{padding:10px 14px 4px 38px}
summary::before{content:"";width:9px;height:9px;border-right:2px solid #C6A15B;border-bottom:2px solid #C6A15B;transform:rotate(-45deg);transition:transform .25s;flex:0 0 auto;margin-right:2px}
details[open]>summary::before{transform:rotate(45deg)}
.tl-month .tl-item{background:#fffdf7}
.tl-start{margin-bottom:22px}
.api-bar{border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:15px;line-height:1.5;border:1px solid}.api-bar.ok{background:#e8f3e6;border-color:#7aa874;color:#1f4a1b}.api-bar.bad{background:#fdeaea;border-color:#c98a8a;color:#6b1d1d}.api-bar code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px}.api-set{display:flex;gap:8px;margin-top:8px}.api-set input{flex:1;font:inherit;font-size:15px;padding:6px 10px;border:1px solid #c6a15b;border-radius:6px}.api-set button{font:inherit;font-size:14px;padding:6px 12px;border:1px solid #3a0f1b;background:#3a0f1b;color:#e7ce94;border-radius:6px;cursor:pointer}
.tl-row{position:relative;display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start;margin-bottom:16px}
.tl-row .tl-item{margin-bottom:0;min-width:0}
.tl-row .tl-dot{top:24px}
.tl-side{text-align:center;padding-top:8px;line-height:1;color:#3A0F1B}
.tl-side b{display:block;font-size:30px;font-weight:500}
.tl-side small{display:block;margin-top:4px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#8A6E3B}
@media(max-width:480px){.tl-month>.tl{padding:10px 8px 4px 26px}.tl-row .tl-dot{left:-23px}.tl-row{grid-template-columns:46px 1fr;gap:8px}.tl-side b{font-size:24px}}
.sync-bar{background:#fff3d6;border:1px solid #C6A15B;border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:16px;color:#3A0F1B}.sync-bar button{margin-left:8px;padding:4px 12px;border:1px solid #3A0F1B;background:#3A0F1B;color:#E7CE94;border-radius:6px;font:inherit;font-size:14px;cursor:pointer}`;
document.head.insertAdjacentHTML('beforeend', '<style>' + TL_CSS + '</style>');
TL.mountNav();
TL.mountStatus();
  </script>
  <script>
    TL.load().then(({ items, online, localCount }) => {
      document.getElementById('tl').innerHTML = TL.group(items);
      if (online && localCount) document.getElementById('note').textContent = 'Includes ' + localCount + ' moment(s) saved on this device only.';
      if (!online) document.getElementById('note').textContent = 'Showing saved moments (live timeline not reachable).';
    });
  </script>
</body>
</html>
